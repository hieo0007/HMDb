name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Install root dependencies
      run: npm install
    
    - name: Lint Frontend
      run: cd cinerate-landing && npm install && npm run lint
      continue-on-error: true
    
    - name: Build Frontend
      run: cd cinerate-landing && npm run build
      continue-on-error: true
    
    - name: Build Backend
      run: cd backend && npm install
      continue-on-error: true

  backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    
    - name: Install dependencies
      run: cd backend && npm install
    
    - name: Check backend
      run: cd backend && npm run dev &
      continue-on-error: true
      timeout-minutes: 2

  frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    
    - name: Install dependencies
      run: cd cinerate-landing && npm install
    
    - name: Build
      run: cd cinerate-landing && npm run build
    
    - name: Preview
      run: cd cinerate-landing && npm run preview &
      continue-on-error: true
      timeout-minutes: 2
